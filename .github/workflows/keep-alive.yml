name: Keep Supabase awake

on:
  schedule:
    - cron: "0 6 */3 * *"   # every 3 days at 06:00 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/rubrics?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase answered with HTTP $status"
          if [ "$status" -ge 400 ]; then
            echo "Supabase did not answer normally. It may be paused: open the dashboard and click Restore."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Monthly heartbeat (keeps GitHub from switching this schedule off)
        run: |
          if [ "$(date -u +%d)" != "01" ]; then
            echo "Not the 1st of the month, nothing to do."
            exit 0
          fi
          date -u > .last-ping
          git config user.name "keep-alive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .last-ping
          git commit -m "Monthly keep-alive"
          git push
